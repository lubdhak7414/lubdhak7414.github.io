<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><title id="t">VAE forward pass with the reparameterization trick</title><desc id="d">x goes into the encoder, which has two heads: mu and s = log sigma squared, K numbers each. sigma = exp(s/2). Noise epsilon from N(0, I) comes in from the side with no parameters. z = mu + sigma times epsilon feeds the decoder, which outputs x-hat. mu and s also feed the KL term. Solid arrows carry gradient; the dashed noise arrow does not.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d232b"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85f08"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56606c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb3"/></marker></defs><rect x="1" y="1" width="1038" height="468" rx="16" fill="#f8f7f3" stroke="#d3cfc6" stroke-width="1.5"/><rect x="20" y="175" width="80" height="50" rx="8" fill="#ffffff" stroke="#1d232b" stroke-width="1.6"/>
<text x="60.0" y="190.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">x</text>
<text x="60.0" y="209.1" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">D numbers</text>
<rect x="130" y="160" width="130" height="80" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="195.0" y="190.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">Encoder body</text>
<text x="195.0" y="209.1" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">weights phi</text>
<line x1="100" y1="200" x2="127" y2="200" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="300" y="60" width="120" height="50" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="360.0" y="75.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">mu</text>
<text x="360.0" y="94.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">K numbers</text>
<rect x="300" y="290" width="120" height="50" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="360.0" y="306.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">s = log sigma^2</text>
<text x="360.0" y="323.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">K numbers</text>
<line x1="260" y1="180" x2="297" y2="95" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="260" y1="220" x2="297" y2="305" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="290" y="160" width="140" height="76" rx="8" fill="#f7d8d4" stroke="#b8322a" stroke-width="1.6"/>
<text x="360.0" y="181.1" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">KL to N(0, I)</text>
<text x="360.0" y="198.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">from mu and s,</text>
<text x="360.0" y="214.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">added to the loss</text>
<line x1="360" y1="110" x2="360" y2="157" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="360" y1="290" x2="360" y2="239" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="470" y="290" width="140" height="50" rx="8" fill="#ffffff" stroke="#1d232b" stroke-width="1.6"/>
<text x="540.0" y="306.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">sigma = exp(s/2)</text>
<text x="540.0" y="323.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">K numbers</text>
<line x1="420" y1="315" x2="467" y2="315" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="455" y="380" width="170" height="56" rx="8" fill="#e9e6df" stroke="#56606c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="540.0" y="399.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">epsilon ~ N(0, I)</text>
<text x="540.0" y="416.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">K numbers, no weights</text>
<rect x="645" y="170" width="200" height="64" rx="8" fill="#fbe3c8" stroke="#b85f08" stroke-width="1.6"/>
<text x="745.0" y="193.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">z = mu + sigma * epsilon</text>
<text x="745.0" y="210.45000000000002" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">K numbers</text>
<line x1="420" y1="85" x2="690" y2="167" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="560" y1="290" x2="700" y2="237" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="625" y1="400" x2="760" y2="237" stroke="#56606c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah-muted)"/>
<text x="650" y="410" font-size="12.5" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">sampled once, held fixed</text>
<text x="650" y="428" font-size="12.5" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">in the backward pass</text>
<rect x="880" y="170" width="120" height="64" rx="8" fill="#d5efdf" stroke="#18794a" stroke-width="1.6"/>
<text x="940.0" y="192.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">Decoder</text>
<text x="940.0" y="211.1" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">weights theta</text>
<line x1="845" y1="202" x2="877" y2="202" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="895" y="290" width="90" height="50" rx="8" fill="#ffffff" stroke="#1d232b" stroke-width="1.6"/>
<text x="940.0" y="305.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">x hat</text>
<text x="940.0" y="324.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">D numbers</text>
<line x1="940" y1="234" x2="940" y2="287" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="830" y="380" width="200" height="56" rx="8" fill="#f7d8d4" stroke="#b8322a" stroke-width="1.6"/>
<text x="930.0" y="399.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">Loss = reconstruction</text>
<text x="930.0" y="416.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">+ beta x KL</text>
<line x1="940" y1="340" x2="940" y2="377" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="650" y1="40" x2="700" y2="40" stroke="#1d232b" stroke-width="2" marker-end="url(#ah-ink)"/>
<text x="710" y="40" font-size="13" text-anchor="start" font-weight="normal" fill="#1d232b" dominant-baseline="middle">solid: gradient flows back along this edge</text>
<line x1="650" y1="70" x2="700" y2="70" stroke="#56606c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-muted)"/>
<text x="710" y="70" font-size="13" text-anchor="start" font-weight="normal" fill="#1d232b" dominant-baseline="middle">dashed: random input, no gradient needed</text>
<text x="520" y="455" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">Backprop reaches mu and s through z (dz/dmu = 1, dz/dsigma = epsilon) and through the KL term.</text></svg>
