<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><title id="t">Why the reparameterization trick lets gradients through</title><desc id="d">Left: sampling z directly from N(0.3, 0.7788 squared) gives z = 0.1442, but the gradient dL/dz = 2.0 stops at the random sampler. Right: z = mu + sigma epsilon with mu 0.3, s -0.5, sigma 0.7788, epsilon -0.2 gives the same z = 0.1442, and the gradient reaches mu (2.0) and s (-0.1558).</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d232b"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85f08"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56606c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb3"/></marker></defs><rect x="1" y="1" width="1038" height="498" rx="16" fill="#f8f7f3" stroke="#d3cfc6" stroke-width="1.5"/><rect x="20" y="20" width="490" height="460" rx="12" fill="#ffffff" stroke="#d3cfc6" stroke-width="1.2"/>
<rect x="530" y="20" width="490" height="460" rx="12" fill="#ffffff" stroke="#d3cfc6" stroke-width="1.2"/>
<text x="265" y="46" font-size="16" text-anchor="middle" font-weight="bold" fill="#b8322a" dominant-baseline="middle">Sample z directly</text>
<rect x="40" y="90" width="110" height="50" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="95.0" y="115.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">mu = 0.3</text>
<rect x="40" y="210" width="110" height="50" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="95.0" y="235.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">s = -0.5</text>
<rect x="195" y="130" width="150" height="90" rx="8" fill="#e9e6df" stroke="#56606c" stroke-width="1.6"/>
<text x="270.0" y="166.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">random sampler</text>
<text x="270.0" y="183.45000000000002" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">z ~ N(0.3, 0.7788^2)</text>
<line x1="150" y1="115" x2="192" y2="150" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="150" y1="235" x2="192" y2="200" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="360" y="150" width="110" height="50" rx="8" fill="#fbe3c8" stroke="#b85f08" stroke-width="1.6"/>
<text x="415.0" y="175.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">z = 0.1442</text>
<line x1="345" y1="175" x2="357" y2="175" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="360" y="330" width="110" height="46" rx="8" fill="#f7d8d4" stroke="#b8322a" stroke-width="1.6"/>
<text x="415.0" y="353.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">loss L</text>
<line x1="390" y1="200" x2="390" y2="327" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<path d="M 450 327 L 450 205" fill="none" stroke="#b8322a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
<text x="482" y="258" font-size="13" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">dL/dz</text>
<text x="482" y="276" font-size="13" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">= 2.0</text>
<path d="M 360 192 C 340 250, 300 260, 280 225" fill="none" stroke="#b8322a" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="270" y="262" font-size="30" text-anchor="middle" font-weight="bold" fill="#b8322a" dominant-baseline="middle">X</text>
<text x="150" y="300" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">no derivative through</text>
<text x="150" y="320" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">a random draw</text>
<text x="95" y="160" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">dL/dmu = ?</text>
<text x="95" y="280" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">dL/ds = ?</text>
<text x="265" y="420" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">The encoder never receives a gradient,</text>
<text x="265" y="442" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">so mu and s never learn.</text>
<text x="775" y="46" font-size="16" text-anchor="middle" font-weight="bold" fill="#18794a" dominant-baseline="middle">Reparameterize: z = mu + sigma * epsilon</text>
<rect x="550" y="90" width="110" height="50" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="605.0" y="115.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">mu = 0.3</text>
<rect x="550" y="250" width="110" height="50" rx="8" fill="#dbe7fb" stroke="#2563c9" stroke-width="1.6"/>
<text x="605.0" y="275.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">s = -0.5</text>
<rect x="690" y="250" width="150" height="50" rx="8" fill="#ffffff" stroke="#1d232b" stroke-width="1.6"/>
<text x="765.0" y="266.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">sigma = e^(s/2)</text>
<text x="765.0" y="283.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">= e^(-0.25) = 0.7788</text>
<line x1="660" y1="265" x2="687" y2="265" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="690" y="340" width="150" height="50" rx="8" fill="#e9e6df" stroke="#56606c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="765.0" y="356.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">epsilon = -0.2</text>
<text x="765.0" y="373.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">constant input</text>
<rect x="875" y="150" width="135" height="70" rx="8" fill="#fbe3c8" stroke="#b85f08" stroke-width="1.6"/>
<text x="942.5" y="168.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">z = 0.3 +</text>
<text x="942.5" y="185.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">0.7788 x (-0.2)</text>
<text x="942.5" y="201.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">= 0.1442</text>
<line x1="660" y1="105" x2="872" y2="160" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="840" y1="262" x2="872" y2="212" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<line x1="840" y1="360" x2="898" y2="224" stroke="#56606c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah-muted)"/>
<rect x="890" y="400" width="110" height="46" rx="8" fill="#f7d8d4" stroke="#b8322a" stroke-width="1.6"/>
<text x="945.0" y="423.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">loss L</text>
<line x1="915" y1="220" x2="915" y2="397" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<path d="M 985 397 L 985 224" fill="none" stroke="#b8322a" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="950" y="300" font-size="13" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">dL/dz</text>
<text x="950" y="318" font-size="13" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">= 2.0</text>
<path d="M 873 182 C 800 200, 720 175, 663 132" fill="none" stroke="#b8322a" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="765" y="206" font-size="13" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">x 1</text>
<text x="605" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#b8322a" dominant-baseline="middle">dL/dmu = 2.0</text>
<path d="M 890 222 L 845 252" fill="none" stroke="#b8322a" stroke-width="2.2" marker-end="url(#ah-red)"/>
<path d="M 690 288 L 663 288" fill="none" stroke="#b8322a" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="605" y="322" font-size="14" text-anchor="middle" font-weight="bold" fill="#b8322a" dominant-baseline="middle">dL/ds = -0.1558</text>
<text x="715" y="425" font-size="13" text-anchor="middle" font-weight="normal" fill="#b8322a" dominant-baseline="middle">dL/ds = 2.0 x (-0.2) x 0.7788/2 = -0.1558</text>
<text x="715" y="458" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#56606c" dominant-baseline="middle">epsilon gets no gradient and needs none.</text></svg>
