<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<rect width="1600" height="720" fill="#ffffff"/>
<style>.k{font:600 20px "IBM Plex Sans";fill:#2451b8;letter-spacing:2.5px}.t{font:600 32px "IBM Plex Sans";fill:#15171a}.s{font:400 26px "IBM Plex Sans";fill:#565c66}.m{font:400 24px "IBM Plex Mono";fill:#565c66}</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#565c66" stroke-width="2.4" stroke-linejoin="round"/></marker>
<marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#2451b8" stroke-width="2.4" stroke-linejoin="round"/></marker></defs>
<!-- sender -->
<rect x="60" y="270" width="330" height="180" rx="8" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="k" x="92" y="318">SENDING SERVER</text>
<text class="t" x="92" y="362">Looks up MX</text>
<text class="m" x="92" y="404">example.com</text>
<!-- paths -->
<path d="M390 330 H440 V160 H492" fill="none" stroke="#565c66" stroke-width="3" marker-end="url(#a)"/>
<path d="M390 390 H440 V560 H492" fill="none" stroke="#565c66" stroke-width="3" marker-end="url(#a)"/>
<!-- top row -->
<rect x="500" y="80" width="440" height="160" rx="8" fill="#f5f6f7" stroke="#c9cdd2" stroke-width="2"/>
<text class="k" x="532" y="126">RESOLVER, OLD CACHE</text>
<text class="t" x="532" y="170">Still has the old MX</text>
<text class="s" x="532" y="210">Answer cached before the switch</text>
<line x1="940" y1="160" x2="1052" y2="160" stroke="#565c66" stroke-width="3" marker-end="url(#a)"/>
<rect x="1060" y="80" width="480" height="160" rx="8" fill="#f5f6f7" stroke="#c9cdd2" stroke-width="2"/>
<text class="k" x="1092" y="126">OLD HOST</text>
<text class="t" x="1092" y="170">Mail is delivered here</text>
<text class="s" x="1092" y="210">So keep the mailbox running</text>
<!-- bottom row -->
<rect x="500" y="480" width="440" height="160" rx="8" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="k" x="532" y="526">RESOLVER, NEW ANSWER</text>
<text class="t" x="532" y="570">Has the new MX</text>
<text class="s" x="532" y="610">Asked the new nameservers</text>
<line x1="940" y1="560" x2="1052" y2="560" stroke="#565c66" stroke-width="3" marker-end="url(#a)"/>
<rect x="1060" y="480" width="480" height="160" rx="8" fill="#ffffff" stroke="#2451b8" stroke-width="2"/>
<text class="k" x="1092" y="526">NEW MAIL HOST</text>
<text class="t" x="1092" y="570">Mail is delivered here</text>
<text class="s" x="1092" y="610">Where everyone ends up</text>
<!-- resync -->
<line x1="1140" y1="240" x2="1140" y2="472" stroke="#2451b8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#b)"/>
<text class="k" x="1166" y="342">SECOND IMAP COPY</text>
<text class="s" x="1166" y="382">Moves the stragglers</text>
</svg>
