<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.s{font-family:"IBM Plex Sans";}.m{font-family:"JetBrains Mono";}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="m" x="72" y="118" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" letter-spacing="2">FOUR SMALL FIXES FROM MY NOTES</text>
<rect x="72.0" y="160.0" width="716.0" height="322.0" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="s" x="112.0" y="244.0" font-size="52" font-weight="600" fill="#15171a" text-anchor="start" >Quiet laptop speakers</text>
<line x1="112.0" y1="284.0" x2="748.0" y2="284.0" stroke="#e4e6e9" stroke-width="2"/>
<text class="m" x="112.0" y="360.0" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" >Easy Effects preset</text>
<text class="s" x="112.0" y="430.0" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >limiter at the end</text>
<rect x="812.0" y="160.0" width="716.0" height="322.0" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="s" x="852.0" y="244.0" font-size="52" font-weight="600" fill="#15171a" text-anchor="start" >Brave keyring prompt</text>
<line x1="852.0" y1="284.0" x2="1488.0" y2="284.0" stroke="#e4e6e9" stroke-width="2"/>
<text class="m" x="852.0" y="360.0" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" >--password-store=basic</text>
<text class="s" x="852.0" y="430.0" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >or unlock it at login</text>
<rect x="72.0" y="506.0" width="716.0" height="322.0" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="s" x="112.0" y="590.0" font-size="52" font-weight="600" fill="#15171a" text-anchor="start" >Ctrl+Backspace in kitty</text>
<line x1="112.0" y1="630.0" x2="748.0" y2="630.0" stroke="#e4e6e9" stroke-width="2"/>
<text class="m" x="112.0" y="706.0" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" >send_text all \x17</text>
<text class="s" x="112.0" y="776.0" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >\x17 is ^W, a word delete</text>
<rect x="812.0" y="506.0" width="716.0" height="322.0" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="s" x="852.0" y="590.0" font-size="52" font-weight="600" fill="#15171a" text-anchor="start" >52G AUR cache</text>
<line x1="852.0" y1="630.0" x2="1488.0" y2="630.0" stroke="#e4e6e9" stroke-width="2"/>
<text class="m" x="852.0" y="706.0" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" >paccache -r</text>
<text class="m" x="852.0" y="776.0" font-size="45" font-weight="500" fill="#565c66" text-anchor="start" >paru -Sc</text>
</svg>
