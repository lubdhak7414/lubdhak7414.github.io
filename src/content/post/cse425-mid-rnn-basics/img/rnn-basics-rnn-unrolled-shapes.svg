<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 570" width="1290" height="570" role="img" aria-labelledby="t d">
<title id="t">RNN rolled and unrolled for three steps</title>
<desc id="d">The rolled cell with its self-loop beside three unrolled copies that reuse the same W_xh, W_hh and W_hy; shapes for D = 3, H = 2, V = 2 and the hidden states from the worked example.</desc>
