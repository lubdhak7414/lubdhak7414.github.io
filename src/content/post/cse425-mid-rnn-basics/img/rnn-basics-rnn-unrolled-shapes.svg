<line x1="860.0" y1="93.0" x2="860.0" y2="72.0" stroke="#57606a" stroke-width="2"/>
<text x="860.0" y="64.0" class="bo lab" text-anchor="middle">L = L_1 + L_2 + L_3</text>
<text x="30.0" y="520.0" class="s" text-anchor="start">Same W_xh (2×3), W_hh (2×2), W_hy (2×2), b_h (2) and b_y (2) in every copy: 6 + 4 + 2 + 4 + 2 = 18 parameters, and T never enters the count.</text>
<text x="30.0" y="546.0" class="s m" text-anchor="start">Shape check: (2×3)(3×1) + (2×2)(2×1) = 2×1.  Colours mark the shared matrices.</text>
