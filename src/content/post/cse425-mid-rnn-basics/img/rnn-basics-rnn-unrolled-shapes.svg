<rect x="87.0" y="426" width="170" height="48" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="172.0" y="446.0" class="s bo" text-anchor="middle">x_t</text>
<text x="172.0" y="465.0" class="s m" text-anchor="middle">D × 1 = 3 × 1</text>
