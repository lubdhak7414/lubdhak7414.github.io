<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.s{font-family:"IBM Plex Sans";}.m{font-family:"IBM Plex Mono";}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<g transform="translate(0,-14)">
<text class="m" x="200" y="146" font-size="22" font-weight="600" letter-spacing="3" fill="#2451b8">SUSPEND AND RESUME, IN SYSTEMD ORDER</text>
<g>
<rect x="201" y="181" width="1198" height="118" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="236" y="252" font-size="24" fill="#6b717b">01</text>
<text class="s" x="300" y="232" font-size="34" font-weight="600" fill="#15171a">sleep.target starts</text>
<text class="m" x="300" y="274" font-size="24" fill="#565c66">units ordered Before= it run ExecStart=</text>
</g>
<path d="M800 306 V340 M788 328 L800 340 L812 328" stroke="#565c66" stroke-width="2.5" fill="none"/>
<g>
<rect x="201" y="347" width="1198" height="118" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="236" y="418" font-size="24" fill="#6b717b">02</text>
<text class="s" x="300" y="398" font-size="34" font-weight="600" fill="#15171a">systemd-suspend.service</text>
<text class="m" x="300" y="440" font-size="24" fill="#565c66">systemd-sleep suspend: asleep until you wake it</text>
</g>
<path d="M800 472 V506 M788 494 L800 506 L812 494" stroke="#565c66" stroke-width="2.5" fill="none"/>
<g>
<rect x="201" y="513" width="1198" height="118" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="236" y="584" font-size="24" fill="#6b717b">03</text>
<text class="s" x="300" y="564" font-size="34" font-weight="600" fill="#15171a">Wake up, sleep.target stops</text>
<text class="m" x="300" y="606" font-size="24" fill="#565c66">StopWhenUnneeded=yes, nothing needs it now</text>
</g>
<path d="M800 638 V672 M788 660 L800 672 L812 660" stroke="#565c66" stroke-width="2.5" fill="none"/>
<g>
<rect x="201" y="679" width="1198" height="118" rx="6" fill="#f5f6f7" stroke="#2451b8" stroke-width="3"/>
<text class="m" x="236" y="750" font-size="24" fill="#2451b8">04</text>
<text class="s" x="300" y="730" font-size="34" font-weight="600" fill="#15171a">ExecStop= runs</text>
<text class="m" x="300" y="772" font-size="24" fill="#565c66">tuned-adm profile powersave</text>
</g>
</g>
</svg>
