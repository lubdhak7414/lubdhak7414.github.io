<text x="285.0" y="1024.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">10 class scores</text>
<text x="285.0" y="1043.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">10 values</text>
<line x1="285" y1="128" x2="285" y2="223" stroke="#1d232b" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="450" y="150" font-size="15" text-anchor="start" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Conv: 25 filters, 3x3, s=1, p=0</text>
<text x="450" y="174" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">(28 - 3)/1 + 1 = 26; depth = 25 filters</text>
<text x="450" y="198" font-size="14" text-anchor="start" font-weight="normal" fill="#18794a" dominant-baseline="middle">params 25 x (3x3x1 + 1) = 250</text>
<line x1="285" y1="284" x2="285" y2="379" stroke="#1d232b" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="450" y="306" font-size="15" text-anchor="start" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Max pool 2x2, stride 2</text>
<text x="450" y="330" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">26 / 2 = 13; channels unchanged</text>
<text x="450" y="354" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">params 0</text>
<line x1="285" y1="440" x2="285" y2="535" stroke="#1d232b" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="450" y="462" font-size="15" text-anchor="start" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Conv: 50 filters, 3x3, s=1, p=0</text>
<text x="450" y="486" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">13 - 3 + 1 = 11; each filter is 3x3x25</text>
<text x="450" y="510" font-size="14" text-anchor="start" font-weight="normal" fill="#18794a" dominant-baseline="middle">params 50 x (3x3x25 + 1) = 11,300</text>
<line x1="285" y1="596" x2="285" y2="691" stroke="#1d232b" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="450" y="618" font-size="15" text-anchor="start" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Max pool 2x2, stride 2</text>
<text x="450" y="642" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">floor(11 / 2) = 5; last row and column dropped</text>
<text x="450" y="666" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">params 0</text>
<line x1="285" y1="752" x2="285" y2="847" stroke="#1d232b" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="450" y="774" font-size="15" text-anchor="start" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Flatten</text>
<text x="450" y="798" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">5 x 5 x 50 = 1250 (channels included)</text>
<text x="450" y="822" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">params 0</text>
<line x1="285" y1="908" x2="285" y2="1003" stroke="#1d232b" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="450" y="930" font-size="15" text-anchor="start" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Dense, 10 outputs, softmax</text>
<text x="450" y="954" font-size="14" text-anchor="start" font-weight="normal" fill="#56606c" dominant-baseline="middle">10 units, each sees all 1250 inputs</text>
<text x="450" y="978" font-size="14" text-anchor="start" font-weight="normal" fill="#18794a" dominant-baseline="middle">params 10 x (1250 + 1) = 12,510</text>
<text x="430" y="1092" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">total parameters: 250 + 11,300 + 12,510 = 24,060</text></svg>
