<text class="m" x="1158" y="408" font-size="23" fill="#15171a" xml:space="preserve">t6 = t4 * t5</text>
<text class="m" x="1496" y="408" font-size="14" fill="#6b717b" text-anchor="end">BinaryOpNode *</text>
<text class="m" x="1158" y="464" font-size="23" fill="#15171a" xml:space="preserve">t7 = t3 + t6</text>
<text class="m" x="1496" y="464" font-size="14" fill="#6b717b" text-anchor="end">BinaryOpNode +</text>
<text class="m" x="1158" y="520" font-size="23" fill="#2451b8" xml:space="preserve">x = t7</text>
<text class="m" x="1496" y="520" font-size="14" fill="#6b717b" text-anchor="end">AssignNode</text>
<text class="s" x="80" y="640" font-size="17" fill="#6b717b">Real output from my Lab 4 compiler. t0 to t2 went to the constant assignments a = 2, b = 3 and c = 4 just above this line.</text>
