<text class="m" x="790" y="427" font-size="14" fill="#6b717b" text-anchor="middle">BinaryOpNode</text>
<text class="m" x="790" y="457" font-size="22" fill="#15171a" text-anchor="middle" xml:space="preserve">*</text>
