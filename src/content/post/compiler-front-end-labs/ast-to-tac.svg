<text class="m" x="1158" y="240" font-size="23" fill="#15171a" xml:space="preserve">t3 = a</text>
<text class="m" x="1496" y="240" font-size="14" fill="#6b717b" text-anchor="end">VarNode a</text>
<text class="m" x="1158" y="296" font-size="23" fill="#15171a" xml:space="preserve">t4 = b</text>
<text class="m" x="1496" y="296" font-size="14" fill="#6b717b" text-anchor="end">VarNode b</text>
<text class="m" x="1158" y="352" font-size="23" fill="#15171a" xml:space="preserve">t5 = c</text>
