<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.s{font-family:"IBM Plex Sans";}.m{font-family:"JetBrains Mono";}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="m" x="72" y="118" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" letter-spacing="2">LAB 4 · SYNTAX TREE TO THREE-ADDRESS CODE</text>
<rect x="72" y="160" width="560" height="668" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="s" x="112" y="236" font-size="45" font-weight="500" fill="#565c66" text-anchor="start" >C source</text>
<line x1="112" y1="268" x2="592" y2="268" stroke="#e4e6e9" stroke-width="2"/>
<text class="m" x="112" y="520" font-size="58" font-weight="500" fill="#15171a" text-anchor="start" >x = a + b * c;</text>
<path d="M652 494 H732 M718 480 L732 494 L718 508" stroke="#565c66" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="752" y="160" width="776" height="668" rx="6" fill="#f5f6f7" stroke="#2451b8" stroke-width="3"/>
<text class="m" x="792" y="236" font-size="45" font-weight="500" fill="#565c66" text-anchor="start" >code.txt</text>
<line x1="792" y1="268" x2="1488" y2="268" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="792" y="350" font-size="56" font-weight="500" fill="#15171a" text-anchor="start" >t3 = a</text>
<text class="m" x="792" y="434" font-size="56" font-weight="500" fill="#15171a" text-anchor="start" >t4 = b</text>
<text class="m" x="792" y="518" font-size="56" font-weight="500" fill="#15171a" text-anchor="start" >t5 = c</text>
<text class="m" x="792" y="602" font-size="56" font-weight="600" fill="#2451b8" text-anchor="start" >t6 = t4 * t5</text>
<text class="m" x="792" y="686" font-size="56" font-weight="500" fill="#15171a" text-anchor="start" >t7 = t3 + t6</text>
<text class="m" x="792" y="770" font-size="56" font-weight="500" fill="#15171a" text-anchor="start" >x = t7</text>
<text class="s" x="1488" y="602" font-size="45" font-weight="500" fill="#2451b8" text-anchor="end" >multiply first</text>
</svg>
