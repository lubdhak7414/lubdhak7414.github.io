<rect x="520.0" y="350" width="240" height="40" rx="8" fill="#d5efdf" stroke="#18794a" stroke-width="1.6"/>
<text x="640.0" y="370.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">Feed-forward (per token)</text>
<rect x="520.0" y="295" width="240" height="40" rx="8" fill="#ffffff" stroke="#1d232b" stroke-width="1.6"/>
