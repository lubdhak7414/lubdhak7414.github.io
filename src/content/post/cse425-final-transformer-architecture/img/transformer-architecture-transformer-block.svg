<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><title id="t">Transformer encoder and decoder layers</title><desc id="d">Encoder layer: multi-head self-attention, Add and Norm, feed-forward, Add and Norm, each with a residual skip. Decoder layer: masked multi-head self-attention, Add and Norm, cross-attention whose K and V come from the encoder output, Add and Norm, feed-forward, Add and Norm. Every arrow carries T_k x 512 in the encoder and T_q x 512 in the decoder. Each stack has 6 layers.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d232b"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85f08"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56606c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb3"/></marker></defs><rect x="1" y="1" width="898" height="798" rx="16" fill="#f8f7f3" stroke="#d3cfc6" stroke-width="1.5"/><rect x="85" y="395" width="290" height="300" rx="12" fill="none" stroke="#2563c9" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="365" y="412" font-size="15" text-anchor="end" font-weight="bold" fill="#2563c9" dominant-baseline="middle">x 6</text>
<text x="230" y="40" font-size="17" text-anchor="middle" font-weight="bold" fill="#2563c9" dominant-baseline="middle">Encoder layer</text>
<text x="230" y="742" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">source tokens + PE</text>
