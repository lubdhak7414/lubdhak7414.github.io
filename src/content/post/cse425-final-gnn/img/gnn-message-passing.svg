<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><title id="t">One GCN message-passing step at node 1</title><desc id="d">Path graph 0-1-2 with features 1, 2, 3. Node 1 gathers 0.4082 x 1, 0.3333 x 2 from its self-loop and 0.4082 x 3, sums them to 2.2997, multiplies by the shared weight w = 2 to get 4.599, and ReLU leaves 4.599.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d232b"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85f08"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56606c"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb3"/></marker></defs><rect x="1" y="1" width="1038" height="498" rx="16" fill="#f8f7f3" stroke="#d3cfc6" stroke-width="1.5"/><text x="520" y="34" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">One GCN layer at node 1 of the path graph 0 - 1 - 2, features x = (1, 2, 3), shared weight w = 2</text>
<line x1="90" y1="120" x2="190" y2="250" stroke="#9a958b" stroke-width="2.5"/>
<line x1="190" y1="250" x2="90" y2="380" stroke="#9a958b" stroke-width="2.5"/>
<path d="M 162 236 C 110 205, 110 295, 162 264" fill="none" stroke="#9a958b" stroke-width="2"/>
<text x="108" y="250" font-size="12.5" text-anchor="end" font-weight="normal" fill="#56606c" dominant-baseline="middle">self-loop</text>
<circle cx="90" cy="120" r="30" fill="#dbe7fb" stroke="#2563c9" stroke-width="2"/>
<text x="90" y="113" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">node 0</text>
<text x="90" y="131" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">x = 1</text>
<circle cx="190" cy="250" r="30" fill="#fbe3c8" stroke="#b85f08" stroke-width="2"/>
<text x="190" y="243" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">node 1</text>
<text x="190" y="261" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">x = 2</text>
<circle cx="90" cy="380" r="30" fill="#dbe7fb" stroke="#2563c9" stroke-width="2"/>
<text x="90" y="373" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">node 2</text>
<text x="90" y="391" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">x = 3</text>
<rect x="300" y="90" width="230" height="60" rx="8" fill="#ffffff" stroke="#2563c9" stroke-width="1.6"/>
<text x="415.0" y="111.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">from node 0</text>
<text x="415.0" y="128.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">1/sqrt(2 x 3) x 1 = 0.4082</text>
<line x1="122" y1="120" x2="297" y2="120" stroke="#2563c9" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<line x1="530" y1="120" x2="597" y2="217.5" stroke="#2563c9" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<rect x="300" y="220" width="230" height="60" rx="8" fill="#ffffff" stroke="#2563c9" stroke-width="1.6"/>
<text x="415.0" y="241.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">self (node 1)</text>
<text x="415.0" y="258.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">1/sqrt(3 x 3) x 2 = 0.6667</text>
<line x1="222" y1="250" x2="297" y2="250" stroke="#2563c9" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<line x1="530" y1="250" x2="597" y2="250.0" stroke="#2563c9" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<rect x="300" y="350" width="230" height="60" rx="8" fill="#ffffff" stroke="#2563c9" stroke-width="1.6"/>
<text x="415.0" y="371.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">from node 2</text>
<text x="415.0" y="388.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">1/sqrt(3 x 2) x 3 = 1.2247</text>
<line x1="122" y1="380" x2="297" y2="380" stroke="#2563c9" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<line x1="530" y1="380" x2="597" y2="282.5" stroke="#2563c9" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="415" y="445" font-size="13" text-anchor="middle" font-weight="normal" fill="#56606c" dominant-baseline="middle">gather: weight = 1/sqrt(d_i d_j), d counts the self-loop</text>
<rect x="600" y="205" width="150" height="90" rx="8" fill="#fbe3c8" stroke="#b85f08" stroke-width="1.6"/>
<text x="675.0" y="224.65" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Aggregate (sum)</text>
<text x="675.0" y="241.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">0.4082 + 0.6667</text>
<text x="675.0" y="258.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">+ 1.2247</text>
<text x="675.0" y="275.35" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">= 2.2997</text>
<rect x="790" y="205" width="110" height="90" rx="8" fill="#d5efdf" stroke="#18794a" stroke-width="1.6"/>
<text x="845.0" y="233.1" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Update</text>
<text x="845.0" y="250.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">x w = 2</text>
<text x="845.0" y="266.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">= 4.599</text>
<line x1="750" y1="250" x2="787" y2="250" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="930" y="215" width="90" height="70" rx="8" fill="#e7defa" stroke="#6b3fb3" stroke-width="1.6"/>
<text x="975.0" y="241.55" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">ReLU</text>
<text x="975.0" y="258.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">h_1 = 4.599</text>
<line x1="900" y1="250" x2="927" y2="250" stroke="#1d232b" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="810" y="345" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">The same w is used at every node:</text>
<text x="810" y="367" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">node 0 gives 2.633, node 2 gives 4.633.</text>
<text x="810" y="405" font-size="13" text-anchor="middle" font-weight="normal" fill="#56606c" dominant-baseline="middle">In general each arrow carries a d-vector,</text>
<text x="810" y="425" font-size="13" text-anchor="middle" font-weight="normal" fill="#56606c" dominant-baseline="middle">the sum stays d wide, and W is d x d_out,</text>
<text x="810" y="445" font-size="13" text-anchor="middle" font-weight="normal" fill="#56606c" dominant-baseline="middle">so the new h_v has d_out numbers.</text>
<text x="520" y="482" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Mean readout over the three nodes: (2.633 + 4.599 + 4.633) / 3 = 3.955</text></svg>
