<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 740" width="1300" height="740" role="img" aria-labelledby="t d">
<title id="t">Computation graph for f = x^2 y sin x + 2 y^2 cos x</title>
<desc id="d">Nine nodes with forward values in blue and backward gradients in red at x = 1, y = 2; the four paths out of x add to -2.28528 and the two paths out of y add to 5.16389.</desc>
