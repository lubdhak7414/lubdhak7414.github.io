<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">XOR with a 2-2-1 step network</title>
<desc id="d">Left: inputs x1 and x2 feed hidden units h1 and h2 with weights 1, -1 and -1, 1, both with bias -0.5; the output adds h1 and h2 with weights 1, 1 and bias -0.5. Middle: truth table. Right: the unit square split by the lines x1 - x2 = 0.5 and x2 - x1 = 0.5; the two corner regions outside the band give output 1, the band between the lines gives output 0.</desc>
<defs>
<style>
text{font-family:'DejaVu Sans',Arial,Helvetica,sans-serif;fill:#1f2328;font-size:15px}
.s{font-size:13px}.m{fill:#57606a}.bl{fill:#1d4ed8}.rd{fill:#b91c1c}.bo{font-weight:bold}
.lab{paint-order:stroke;stroke:#fafaf7;stroke-width:6px;stroke-linejoin:round}
.node{fill:#ffffff;stroke:#1f2328;stroke-width:2}
.edge{stroke:#57606a;stroke-width:2;fill:none}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="470" rx="16" fill="#fafaf7"/>
<text x="24" y="36" class="bo" style="font-size:17px">Network (step units: output 1 if z &gt; 0)</text>

<!-- edges into hidden -->
<line class="edge" x1="114" y1="140" x2="296" y2="140" marker-end="url(#ar)"/>
<line class="edge" x1="108" y1="320" x2="302" y2="160" marker-end="url(#ar)"/>
<line class="edge" x1="108" y1="160" x2="302" y2="320" marker-end="url(#ar)"/>
<line class="edge" x1="114" y1="340" x2="296" y2="340" marker-end="url(#ar)"/>
<!-- edges into output -->
<line class="edge" x1="364" y1="150" x2="532" y2="226" marker-end="url(#ar)"/>
<line class="edge" x1="364" y1="330" x2="532" y2="254" marker-end="url(#ar)"/>

<text x="250" y="130" class="lab bl bo" text-anchor="middle">1</text>
<text x="262" y="198" class="lab bl bo" text-anchor="middle">-1</text>
<text x="262" y="292" class="lab bl bo" text-anchor="middle">-1</text>
<text x="250" y="330" class="lab bl bo" text-anchor="middle">1</text>
<text x="452" y="180" class="lab bl bo" text-anchor="middle">1</text>
<text x="452" y="314" class="lab bl bo" text-anchor="middle">1</text>

<circle class="node" cx="80" cy="140" r="34"/><text x="80" y="146" text-anchor="middle">x1</text>
<circle class="node" cx="80" cy="340" r="34"/><text x="80" y="346" text-anchor="middle">x2</text>
<circle class="node" cx="330" cy="140" r="34"/><text x="330" y="146" text-anchor="middle">h1</text>
<circle class="node" cx="330" cy="340" r="34"/><text x="330" y="346" text-anchor="middle">h2</text>
<circle class="node" cx="566" cy="240" r="34"/><text x="566" y="246" text-anchor="middle">y</text>

<text x="330" y="92" text-anchor="middle" class="s">b = -0.5</text>
<text x="330" y="398" text-anchor="middle" class="s">b = -0.5</text>
<text x="566" y="192" text-anchor="middle" class="s">b = -0.5</text>
<text x="330" y="420" text-anchor="middle" class="s m">h2: x2 AND NOT x1</text>
<text x="330" y="70" text-anchor="middle" class="s m">h1: x1 AND NOT x2</text>
<text x="566" y="300" text-anchor="middle" class="s m">y = h1 OR h2</text>

<!-- truth table -->
<g transform="translate(660,110)">
<text x="0" y="0" class="bo s">x1</text><text x="34" y="0" class="bo s">x2</text>
<text x="80" y="0" class="bo s">h1</text><text x="114" y="0" class="bo s">h2</text>
<text x="160" y="0" class="bo s">y</text>
<line x1="0" y1="10" x2="176" y2="10" stroke="#57606a" stroke-width="1.5"/>
<line x1="66" y1="-16" x2="66" y2="160" stroke="#57606a" stroke-width="1.5"/>
<line x1="146" y1="-16" x2="146" y2="160" stroke="#57606a" stroke-width="1.5"/>
<g class="s">
<text x="4" y="40">0</text><text x="38" y="40">0</text><text x="84" y="40">0</text><text x="118" y="40">0</text><text x="162" y="40" class="bo">0</text>
<text x="4" y="76">0</text><text x="38" y="76">1</text><text x="84" y="76">0</text><text x="118" y="76">1</text><text x="162" y="76" class="bo rd">1</text>
<text x="4" y="112">1</text><text x="38" y="112">0</text><text x="84" y="112">1</text><text x="118" y="112">0</text><text x="162" y="112" class="bo rd">1</text>
<text x="4" y="148">1</text><text x="38" y="148">1</text><text x="84" y="148">0</text><text x="118" y="148">0</text><text x="162" y="148" class="bo">0</text>
</g>
</g>

<!-- unit square: data -0.25..1.25 maps to px 880..1160 (x) and 380..100 (y), 186.67 px per unit -->
<text x="1020" y="36" class="bo" text-anchor="middle" style="font-size:17px">Input plane</text>
<rect x="880" y="100" width="280" height="280" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
<!-- h1 = 1 region: x1 - x2 > 0.5 -->
<polygon points="973.3,380 1160,380 1160,193.3" fill="#b91c1c" fill-opacity="0.13"/>
<!-- h2 = 1 region: x2 - x1 > 0.5 -->
<polygon points="880,286.7 880,100 1066.7,100" fill="#b91c1c" fill-opacity="0.13"/>
<line x1="973.3" y1="380" x2="1160" y2="193.3" stroke="#1d4ed8" stroke-width="2.5"/>
<line x1="880" y1="286.7" x2="1066.7" y2="100" stroke="#1d4ed8" stroke-width="2.5"/>
<!-- points: (0,0) (1,0) (0,1) (1,1) -->
<circle cx="926.7" cy="333.3" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
<circle cx="1113.3" cy="146.7" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
<circle cx="1113.3" cy="333.3" r="9" fill="#1f2328"/>
<circle cx="926.7" cy="146.7" r="9" fill="#1f2328"/>
<text x="1150" y="370" class="s rd bo" text-anchor="end">h1 = 1, y = 1</text>
<text x="890" y="120" class="s rd bo">h2 = 1, y = 1</text>
<text x="1020" y="246" class="s bo" text-anchor="middle" transform="rotate(-45 1020 240)">band: h1 = h2 = 0, y = 0</text>
<text x="926.7" y="404" class="s" text-anchor="middle">0</text>
<text x="1113.3" y="404" class="s" text-anchor="middle">1</text>
<text x="1020" y="430" class="s" text-anchor="middle">x1</text>
<text x="868" y="338" class="s" text-anchor="end">0</text>
<text x="868" y="151" class="s" text-anchor="end">1</text>
<text x="862" y="244" class="s" text-anchor="middle">x2</text>
<text x="1020" y="456" class="s bl" text-anchor="middle">lines: x1 - x2 = 0.5 (h1) and x2 - x1 = 0.5 (h2)</text>
</svg>
