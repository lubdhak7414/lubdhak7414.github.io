<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.s{font-family:"IBM Plex Sans";}.m{font-family:"JetBrains Mono";}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="m" x="72" y="118" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" letter-spacing="2">HOW THE ETHERHIDING LOADER WORKS</text>
<rect x="72" y="152.0" width="1456" height="155.5" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="112" y="244.75" font-size="45" font-weight="500" fill="#6b717b" text-anchor="start" >01</text>
<text class="m" x="222" y="222.0" font-size="54" font-weight="600" fill="#15171a" text-anchor="start" >wp-config.php</text>
<text class="s" x="222" y="277.5" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >adds a base64 script to every page</text>
<rect x="72" y="325.5" width="1456" height="155.5" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="112" y="418.25" font-size="45" font-weight="500" fill="#6b717b" text-anchor="start" >02</text>
<text class="m" x="222" y="395.5" font-size="54" font-weight="600" fill="#15171a" text-anchor="start" >eth_call</text>
<text class="s" x="222" y="451.0" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >the visitor's browser asks a BNB Chain testnet node</text>
<rect x="72" y="499.0" width="1456" height="155.5" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
<text class="m" x="112" y="591.75" font-size="45" font-weight="500" fill="#6b717b" text-anchor="start" >03</text>
<text class="s" x="222" y="569.0" font-size="54" font-weight="600" fill="#15171a" text-anchor="start" >smart contract</text>
<text class="s" x="222" y="624.5" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >hands back the payload</text>
<rect x="72" y="672.5" width="1456" height="155.5" rx="6" fill="#f5f6f7" stroke="#2451b8" stroke-width="3"/>
<text class="m" x="112" y="765.25" font-size="45" font-weight="500" fill="#2451b8" text-anchor="start" >04</text>
<text class="m" x="222" y="742.5" font-size="54" font-weight="600" fill="#15171a" text-anchor="start" >eval()</text>
<text class="s" x="222" y="798.0" font-size="45" font-weight="400" fill="#565c66" text-anchor="start" >runs whatever came back</text>
</svg>
