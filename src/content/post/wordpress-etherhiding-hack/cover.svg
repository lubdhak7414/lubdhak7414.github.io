<text class="m" x="670" y="580" font-size="19" xml:space="preserve"><tspan fill="#c792ea">const </tspan><tspan fill="#e6e9ef">res</tspan><tspan fill="#e6e9ef"> = </tspan><tspan fill="#c792ea">await </tspan><tspan fill="#82aaff">fetch</tspan><tspan fill="#e6e9ef">(TESTNET_RPC, {</tspan></text>
