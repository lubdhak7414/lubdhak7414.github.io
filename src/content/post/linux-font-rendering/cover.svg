<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.s{font-family:"IBM Plex Sans";}.m{font-family:"JetBrains Mono";}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="m" x="72" y="118" font-size="45" font-weight="600" fill="#2451b8" text-anchor="start" letter-spacing="2">TWO FIXES FOR THIN FONTS ON A 1080P SCREEN</text>
<rect x="72.0" y="160" width="712.0" height="668" rx="6" fill="#ffffff" stroke="#c9cdd2" stroke-width="2"/>
