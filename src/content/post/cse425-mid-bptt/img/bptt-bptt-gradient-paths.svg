<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 640" width="1250" height="640" role="img" aria-labelledby="t d">
<title id="t">Backpropagation through time on a 3-step scalar RNN</title>
<desc id="d">Forward values h1 = 0.4621, h2 = 0.5509, h3 = -0.0592 and loss 0.2173; deltas -0.6569, -0.3660, -0.2303 shrink by 0.557 and 0.629 per step; the gradients for the shared w and u sum one term per step.</desc>
<defs><style>
text{font-family:'DejaVu Sans',Arial,Helvetica,sans-serif;fill:#1f2328;font-size:15px}
.s{font-size:13px}.l{font-size:17px}.m{fill:#57606a}.bl{fill:#1d4ed8}.rd{fill:#b91c1c}
.gr{fill:#15803d}.or{fill:#c2410c}.pu{fill:#7e22ce}.bo{font-weight:bold}
.lab{paint-order:stroke;stroke:#fafaf7;stroke-width:6px;stroke-linejoin:round}
.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
</style><marker id="a1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ab91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ac2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="a7e22ce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker></defs>
<rect x="0" y="0" width="1250" height="640" rx="16" fill="#fafaf7"/>
<text x="24.0" y="36.0" class="l bo" text-anchor="start">h_t = tanh(w x_t + u h_t-1),  w = 0.5,  u = 0.8,  target 0.6 at t = 3 only</text>
<rect x="230" y="60" width="300" height="420" rx="12" fill="#e3f8f3" stroke="none" stroke-width="2" />
<text x="242" y="84" class="bo" style="fill:#0f766e">step 1</text>
<rect x="550" y="60" width="300" height="420" rx="12" fill="#f1edff" stroke="none" stroke-width="2" />
<text x="562" y="84" class="bo" style="fill:#7e22ce">step 2</text>
<rect x="870" y="60" width="300" height="420" rx="12" fill="#fdf5dc" stroke="none" stroke-width="2" />
<text x="882" y="84" class="bo" style="fill:#b45309">step 3</text>
<rect x="910" y="96" width="220" height="54" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
<text x="1020.0" y="118.0" class="s bo" text-anchor="middle">L3 = ½(h3 - 0.6)²</text>
<text x="1020.0" y="139.0" class="s or bo" text-anchor="middle">= 0.2173</text>
<line x1="1000.0" y1="242.0" x2="1000.0" y2="152.0" stroke="#57606a" stroke-width="2" marker-end="url(#a57606a)"/>
<line x1="1040.0" y1="152.0" x2="1040.0" y2="240.0" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ab91c1c)"/>
<text x="1048.0" y="178.0" class="s rd lab" text-anchor="start">h3 - 0.6 = -0.6592</text>
<text x="150.0" y="330.0" class="bo" text-anchor="middle">h0 = 0</text>
<rect x="270.0" y="242.0" width="220" height="116" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="380.0" y="268.0" class="bo" text-anchor="middle">h1 = tanh(z1)</text>
<text x="380.0" y="290.0" class="bl" text-anchor="middle">= 0.4621</text>
<text x="380.0" y="312.0" class="s m" text-anchor="middle">tanh' = 1 - h1² = 0.7864</text>
<text x="380.0" y="338.0" class="rd bo" text-anchor="middle">δ1 = -0.2303</text>
<rect x="330" y="410" width="100" height="40" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="380.0" y="436.0" class="bo" text-anchor="middle">x1 = 1</text>
<line x1="380.0" y1="408.0" x2="380.0" y2="360.0" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#a1d4ed8)"/>
<text x="388.0" y="390.0" class="s bo bl lab" text-anchor="start">w = 0.5</text>
<rect x="590.0" y="242.0" width="220" height="116" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="700.0" y="268.0" class="bo" text-anchor="middle">h2 = tanh(z2)</text>
<text x="700.0" y="290.0" class="bl" text-anchor="middle">= 0.5509</text>
<text x="700.0" y="312.0" class="s m" text-anchor="middle">tanh' = 1 - h2² = 0.6965</text>
<text x="700.0" y="338.0" class="rd bo" text-anchor="middle">δ2 = -0.3660</text>
<rect x="650" y="410" width="100" height="40" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="700.0" y="436.0" class="bo" text-anchor="middle">x2 = 0.5</text>
<line x1="700.0" y1="408.0" x2="700.0" y2="360.0" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#a1d4ed8)"/>
<text x="708.0" y="390.0" class="s bo bl lab" text-anchor="start">w = 0.5</text>
<rect x="910.0" y="242.0" width="220" height="116" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="1020.0" y="268.0" class="bo" text-anchor="middle">h3 = tanh(z3)</text>
<text x="1020.0" y="290.0" class="bl" text-anchor="middle">= -0.0592</text>
<text x="1020.0" y="312.0" class="s m" text-anchor="middle">tanh' = 1 - h3² = 0.9965</text>
<text x="1020.0" y="338.0" class="rd bo" text-anchor="middle">δ3 = -0.6569</text>
<rect x="970" y="410" width="100" height="40" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2" />
<text x="1020.0" y="436.0" class="bo" text-anchor="middle">x3 = -1</text>
<line x1="1020.0" y1="408.0" x2="1020.0" y2="360.0" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#a1d4ed8)"/>
<text x="1028.0" y="390.0" class="s bo bl lab" text-anchor="start">w = 0.5</text>
<line x1="190.0" y1="330.0" x2="268.0" y2="330.0" stroke="#c2410c" stroke-width="2.6" marker-end="url(#ac2410c)"/>
<text x="230.0" y="352.0" class="s bo or" text-anchor="middle">u = 0.8</text>
<line x1="490.0" y1="330.0" x2="588.0" y2="330.0" stroke="#c2410c" stroke-width="2.6" marker-end="url(#ac2410c)"/>
<text x="540.0" y="352.0" class="s bo or" text-anchor="middle">u = 0.8</text>
<line x1="810.0" y1="330.0" x2="908.0" y2="330.0" stroke="#c2410c" stroke-width="2.6" marker-end="url(#ac2410c)"/>
<text x="860.0" y="352.0" class="s bo or" text-anchor="middle">u = 0.8</text>
<line x1="590.0" y1="278.0" x2="492.0" y2="278.0" stroke="#b91c1c" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#ab91c1c)"/>
<text x="540.0" y="270.0" class="s bo rd lab" text-anchor="middle">× 0.629</text>
<text x="540.0" y="216.0" class="s rd lab" text-anchor="middle">u · tanh'(z1) = 0.8 · 0.7864</text>
<line x1="910.0" y1="278.0" x2="812.0" y2="278.0" stroke="#b91c1c" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#ab91c1c)"/>
<text x="860.0" y="270.0" class="s bo rd lab" text-anchor="middle">× 0.557</text>
<text x="860.0" y="216.0" class="s rd lab" text-anchor="middle">u · tanh'(z2) = 0.8 · 0.6965</text>
<text x="24" y="530" class="bo">∂L/∂w = Σ δt xt = <tspan style="fill:#0f766e">(-0.2303)(1)</tspan> + <tspan style="fill:#7e22ce">(-0.3660)(0.5)</tspan> + <tspan style="fill:#b45309">(-0.6569)(-1)</tspan> = 0.2436</text>
<text x="24" y="562" class="bo">∂L/∂u = Σ δt ht-1 = <tspan style="fill:#0f766e">(-0.2303)(0)</tspan> + <tspan style="fill:#7e22ce">(-0.3660)(0.4621)</tspan> + <tspan style="fill:#b45309">(-0.6569)(0.5509)</tspan> = -0.5310</text>
<text x="24.0" y="596.0" class="s m" text-anchor="start">Blue w and orange u are the same two numbers in every step. Each step adds one term to their gradient (sum over time),</text>
<text x="24.0" y="618.0" class="s m" text-anchor="start">while the delta travelling left is multiplied by u · tanh' at every step (product over time).</text>
</svg>
