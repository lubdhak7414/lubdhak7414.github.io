<text x="220" y="362" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">-inf becomes weight 0, so row 1 is [1, 0, 0, 0]</text>
<text x="220" y="384" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1d232b" dominant-baseline="middle">and token i only sees tokens 1 to i.</text>
<text x="220" y="420" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1d232b" dominant-baseline="middle">Only decoder self-attention is masked.</text>
